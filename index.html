<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>amitheidiot</title>
    <meta name="description" content="amitheidiot — are you smarter than an idiot? find out soon." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="fonts.css" />
    <style>
      :root {
        --ink: #16130e;
        --paper: #f1ece0;
        --blood: #ff5a5f;
        --gold: #e5c158;
        --aegean: #6c8cff;
        --dim: rgba(241, 236, 224, 0.55);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--ink);
        color: var(--paper);
        font-family: 'Space Grotesk', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 1.5rem;
        padding: 1.5rem;
        overflow-x: hidden;
        position: relative;
      }
      .mark {
        font-family: 'Anton', sans-serif;
        line-height: 0.95;
        letter-spacing: -0.01em;
        font-size: clamp(3.2rem, 15vw, 11rem);
        color: var(--paper);
        text-shadow: 0.05em 0.05em 0 rgba(0, 0, 0, 0.5);
      }
      .mark .idiot { color: var(--blood); }
      .question {
        font-family: 'Anton', sans-serif;
        text-transform: uppercase;
        font-size: clamp(1.3rem, 4.5vw, 2.6rem);
        color: var(--paper);
        letter-spacing: 0.02em;
      }
      .question .q { color: var(--blood); }
      .soon {
        font-size: clamp(1rem, 3vw, 1.6rem);
        font-weight: 500;
        letter-spacing: 0.34em;
        color: var(--gold);
      }
      .hint {
        font-family: 'GFS Didot', serif;
        font-size: clamp(0.7rem, 1.8vw, 0.95rem);
        color: var(--dim);
        letter-spacing: 0.18em;
      }
      .float {
        position: absolute;
        font-family: 'GFS Didot', serif;
        color: var(--aegean);
        opacity: 0.07;
        user-select: none;
        pointer-events: none;
        animation: floaty 14s ease-in-out infinite;
      }
      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-26px) rotate(4deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .float { animation: none; }
      }
    </style>
  </head>
  <body>
    <span class="float" style="top:12%; left:10%; font-size:5rem; animation-delay:0s">ἰ</span>
    <span class="float" style="top:70%; left:14%; font-size:3rem; animation-delay:1.8s">δ</span>
    <span class="float" style="top:20%; right:12%; font-size:4rem; animation-delay:0.9s">ι</span>
    <span class="float" style="top:74%; right:8%; font-size:5.5rem; animation-delay:2.6s">ώ</span>
    <span class="float" style="top:46%; left:44%; font-size:2.8rem; animation-delay:1.2s">τ</span>
    <span class="float" style="top:82%; left:38%; font-size:3.2rem; animation-delay:2s">η</span>

    <h1 class="mark">amithe<span class="idiot">idiot</span></h1>
    <p class="question">are you smarter than an <span class="q">idiot?</span></p>
    <p class="soon">find out soon.</p>
    <p class="hint">ἰδιώτης &nbsp;·&nbsp; Constitution Day &nbsp;·&nbsp; Sept 17, 2026</p>
  </body>
</html>
