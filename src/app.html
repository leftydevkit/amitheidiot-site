<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				var t = localStorage.getItem('amitheidiot-theme');
				if (t === 'light') {
					document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
		</script>
		<script defer src="https://umami.leftydevkit.com/script.js" data-website-id="0fef7033-cf71-420d-ae23-36167e111b98"></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
